version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: erp-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-diabolical_erp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-diabolical_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: erp-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-diabolical_erp}
      JWT_SECRET: ${JWT_SECRET:-diabolical_secret_dev}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-6261c34a1795ca1202e70e289f664a781077977a41926b6438a2e1d6d84f981e}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://erp.diabolicalservices.tech}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://erp-back.diabolicalservices.tech}
    container_name: erp-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
